plugins {
    id "java"
    // UPDATED: Version 1.13+ supports Gradle 9's new API
    id "dev.architectury.loom" version "1.13-SNAPSHOT"
    id "com.gradleup.shadow" version "8.3.0"
}

version = "1.0.0"
group = "com.futureclient"
archivesBaseName = "FutureClient"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

loom {
    forge {
        pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
        // mixinConfigs = ["mixins.futureclient.json"] 
    }
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

repositories {
    mavenCentral()
    maven { url "https://repo.spongepowered.org/maven/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.8.9"
    mappings "de.oceanlabs.mcp:mcp_stable:22-1.8.9"
    forge "net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9"

    implementation "com.google.code.gson:gson:2.8.9"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.8.9"

    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": "1.8.9"
    }
    rename '(.+_at.cfg)', 'META-INF/$1'
}

shadowJar {
    archiveClassifier.set("")
    configurations = [project.configurations.shade]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    dependencies {
        exclude(dependency("com.google.code.gson:gson"))
    }
}

tasks.build.dependsOn shadowJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

plugins {
    id 'java'
    id 'gg.essential.loom' version '0.10.0.+' // The modern Forge 1.8.9 link
    id 'net.kyori.blossom' version '1.3.0'     // For variable substitution
}

group = 'com.futureclient'
version = '1.0.0'
archivesBaseName = 'FutureClient'

// 1. JAVA TOOLCHAINS
// This tells Gradle 9 (running on Java 21) to download and use 
// a specific Java 8 JDK for compiling this mod.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    // ensure reproducible builds
    withSourcesJar()
}

// 2. LOOM CONFIGURATION
loom {
    // This allows you to run the client directly from IDE via Gradle
    launchConfigs {
        client {
            // Optional: Add arguments here if needed for specific GPUs
            // property "org.lwjgl.opengl.Display.allowSoftwareOpenGL", "true"
        }
    }

    forge {
        // Fixes old Forge jar signing issues on new Java versions
        pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
        
        // UNCOMMENT BELOW if you add Mixins later (Standard for PvP Clients)
        // mixinConfig "mixins.futureclient.json"
    }

    // Maps the obfuscated code to readable names
    // "srg" is standard for Forge 1.8.9
    // "mojang" mappings are also available if preferred
}

repositories {
    mavenCentral()
    maven { url "https://repo.spongepowered.org/maven/" }
}

dependencies {
    // --- MINECRAFT & FORGE ---
    // The specific versions required for Hypixel/PvP compatibility
    minecraft "com.mojang:minecraft:1.8.9"
    mappings "de.oceanlabs.mcp:mcp_stable:22-1.8.9"
    forge "net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9"

    // --- LIBRARIES ---
    // Gson is provided by MC, but we declare it for compile-time safety
    implementation 'com.google.code.gson:gson:2.8.9'
    
    // --- MIXINS (Optional but Recommended) ---
    // Most PvP clients eventually need Mixins for rendering hooks.
    // This setup allows you to add them without breaking the build.
    compileOnly('org.spongepowered:mixin:0.7.11-SNAPSHOT')
    annotationProcessor('org.spongepowered:mixin:0.7.11-SNAPSHOT')
}

// 3. RESOURCE PROCESSING
// Replaces ${version} in mcmod.info automatically
processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.8.9"

    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": "1.8.9"
    }
}

// 4. COMPILATION FLAGS
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // Enable this to debug variables in your IDE
    options.compilerArgs << "-parameters"
}

jar {
    manifest {
        attributes(
            "ModSide": "CLIENT",
            "TweakOrder": 0,
            "ForceLoadAsMod": true
            // If you add Mixins later, you will add "TweakClass" here
        )
    }
}

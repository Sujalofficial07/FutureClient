import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'idea'
    id 'java'
    id 'gg.essential.loom' version '0.10.0.+'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.jetbrains.kotlin.jvm' version '1.9.0'
}

/* =======================
   Constants
   ======================= */

def baseGroup = project.property("baseGroup")
def mcVersion = project.property("mcVersion")
def modid = project.property("modid")
def mixinGroup = "${baseGroup}.mixin"

/* =======================
   Java Toolchain
   ======================= */

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

/* =======================
   Source sets
   ======================= */

sourceSets {
    main {
        java.srcDir "src/main/kotlin"
        output.resourcesDir = java.classesDirectory.get().asFile
    }
}

/* =======================
   Repositories
   ======================= */

repositories {
    mavenCentral()
    mavenLocal()
    maven { url "https://repo.spongepowered.org/maven/" }
    maven { url "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
    maven { url "https://repo.nea.moe/releases" }
    maven { url "https://maven.notenoughupdates.org/releases" }
}

/* =======================
   Configurations
   ======================= */

configurations {
    shadowImpl
    shadowModImpl
    devenvMod {
        transitive = false
        visible = false
    }

    implementation.extendsFrom shadowImpl
    modImplementation.extendsFrom shadowModImpl
}

/* =======================
   Dependencies
   ======================= */

dependencies {
    minecraft "com.mojang:minecraft:1.8.9"
    mappings "de.oceanlabs.mcp:mcp_stable:22-1.8.9"
    forge "net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    shadowImpl("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3") {
        exclude group: "org.jetbrains.kotlin"
    }

    shadowImpl("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        transitive = false
    }
    annotationProcessor "org.spongepowered:mixin:0.8.5-SNAPSHOT"

    runtimeOnly "me.djtheredstoner:DevAuth-forge-legacy:1.1.2"

    shadowImpl libs.libautoupdate
    shadowImpl "org.jetbrains.kotlin:kotlin-reflect:1.9.0"

    shadowModImpl libs.moulconfig
    devenvMod variantOf(libs.moulconfig) { classifier("test") }
}

/* =======================
   Loom (Minecraft)
   ======================= */

loom {
    launchConfigs {
        client {
            property "mixin.debug", "true"
            property "asmhelper.verbose", "true"
            arg "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker"
            arg "--mods", configurations.devenvMod.resolve().collect {
                it.relativeTo(file("run")).path
            }.join(",")
        }
    }

    forge {
        pack200Provider.set(dev.architectury.pack200.java.Pack200Adapter)
        mixinConfig "mixins.${modid}.json"
    }

    mixin {
        defaultRefmapName.set("mixins.${modid}.refmap.json")
    }
}

/* =======================
   Tasks
   ======================= */

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(Jar).configureEach {
    archiveBaseName.set(modid)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true",
            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "MixinConfigs": "mixins.${modid}.json"
        )
    }
}

tasks.processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", mcVersion
    inputs.property "modid", modid
    inputs.property "mixinGroup", mixinGroup

    filesMatching(["mcmod.info", "mixins.${modid}.json"]) {
        expand(inputs.properties)
    }

    rename "(.+_at.cfg)", "META-INF/$1"
}

tasks.register("remapJar", RemapJarTask) {
    dependsOn tasks.shadowJar
    archiveClassifier.set("")
    from tasks.shadowJar
    input.set(tasks.shadowJar.archiveFile)
}

tasks.shadowJar {
    archiveClassifier.set("all-dev")
    destinationDirectory.set(layout.buildDirectory.dir("badjars"))
    configurations = [configurations.shadowImpl, configurations.shadowModImpl]
    exclude "META-INF/versions/**"

    relocate "io.github.moulberry.moulconfig", "${baseGroup}.deps.moulconfig"
    relocate "moe.nea.libautoupdate", "${baseGroup}.deps.libautoupdate"
}

tasks.jar {
    archiveClassifier.set("nodeps")
    destinationDirectory.set(layout.buildDirectory.dir("badjars"))
}

tasks.assemble {
    dependsOn tasks.remapJar
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = "1.8"
}
